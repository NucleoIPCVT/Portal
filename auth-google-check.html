<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verificação de acesso Google · IPCVT</title>
<script src="https://accounts.google.com/gsi/client" async defer onload="document.getElementById('open-google').disabled=false;document.getElementById('status').textContent='Pronto para verificar a abertura do Google.'"></script>
<style>body{font:16px system-ui;max-width:40rem;margin:12vh auto;padding:24px;background:#f7f5ef;color:#24372d}button{padding:14px 24px;border:0;border-radius:12px;background:#34624b;color:white;font:inherit}</style></head>
<body><h1>Verificação de acesso Google</h1><p>Verificação temporária da abertura da escolha de conta.</p><button id="open-google" disabled>Verificar abertura do Google</button><p id="status" role="status">Carregando Google…</p>
<script>
document.getElementById('open-google').addEventListener('click',()=>{
const status=document.getElementById('status');status.textContent='Abrindo o Google…';
const client=google.accounts.oauth2.initTokenClient({
client_id:'774659782213-7bvortfkfrr9af5opk9mmtat9l695o64.apps.googleusercontent.com',
scope:'openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
include_granted_scopes:false,prompt:'select_account',
callback:response=>{status.textContent=response.error?'Google: '+response.error:'Escolha de conta concluída.'},
error_callback:error=>{status.textContent='Google: '+(error.type||'erro')}
});client.requestAccessToken({prompt:'select_account'});
});
</script></body></html>
