<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" role="img" aria-labelledby="title desc">
<title id="title">Grupo vocal em aquarela</title>
<desc id="desc">Coro misto e piano ilustrados em pinceladas suaves, com notas musicais e tons de areia, café e grafite.</desc>
<defs>
 <linearGradient id="paper" x2="1" y2=".4"><stop stop-color="#f8eade" stop-opacity=".15"/><stop offset=".54" stop-color="#f2dbc3" stop-opacity=".42"/><stop offset="1" stop-color="#e2c3a7" stop-opacity=".85"/></linearGradient>
 <linearGradient id="fade"><stop stop-color="#f7ebdf" stop-opacity="0"/><stop offset=".4" stop-color="#f6e3d0" stop-opacity=".15"/><stop offset="1" stop-color="#e9c8a7" stop-opacity=".56"/></linearGradient>
 <linearGradient id="coat" x2=".8" y2="1"><stop stop-color="#9b8b80"/><stop offset="1" stop-color="#776b65"/></linearGradient>
 <linearGradient id="dress" x2=".6" y2="1"><stop stop-color="#ce9980"/><stop offset="1" stop-color="#ad755f"/></linearGradient>
 <radialGradient id="wash"><stop stop-color="#c89f78" stop-opacity=".44"/><stop offset="1" stop-color="#d7b398" stop-opacity="0"/></radialGradient>
 <filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="2.5"/></filter>
 <filter id="brush" x="-18%" y="-18%" width="136%" height="136%">
  <feTurbulence type="fractalNoise" baseFrequency=".025 .048" numOctaves="3" seed="9" result="noise"/>
  <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="papertexture"><feTurbulence type="fractalNoise" baseFrequency=".17" numOctaves="2" seed="6" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".075"/></feComponentTransfer></filter>
</defs>
<rect width="880" height="240" fill="#f8ede2"/>
<rect width="880" height="240" fill="url(#paper)"/>
<ellipse cx="650" cy="155" rx="310" ry="165" fill="url(#wash)" filter="url(#soft)"/>
<path d="M240 185Q370 105 512 144T880 126L880 240H260Z" fill="#bca799" opacity=".17" filter="url(#brush)"/>
<path d="M325 43C449 8 557 28 700 51" fill="none" stroke="#8f765f" stroke-width="1.7" opacity=".46"/>
<path d="M319 55C451 21 556 41 702 63M316 68C451 34 553 54 706 76M312 81C450 47 555 67 710 89M309 94C448 60 554 80 714 102" fill="none" stroke="#a58870" stroke-width="1.5" opacity=".39"/>
<g fill="#866850" opacity=".75"><ellipse cx="389" cy="62" rx="8" ry="5" transform="rotate(-26 389 62)"/><path d="M396 61v-24l14-6v5l-11 5v22" fill="#866850"/><ellipse cx="487" cy="55" rx="8" ry="5" transform="rotate(-21 487 55)"/><path d="M493 55V30l8 8" fill="none" stroke="#866850" stroke-width="3"/><ellipse cx="603" cy="61" rx="8" ry="5" transform="rotate(-20 603 61)"/><path d="M610 61V32l13 5" fill="none" stroke="#866850" stroke-width="3"/></g>
